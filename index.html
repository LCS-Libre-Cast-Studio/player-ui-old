<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Libre Cast Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
</head>
<body class="bg-black text-white h-screen flex flex-col">
    <header class="p-6 flex items-center justify-between">
        <nav class="flex gap-6 text-sm font-bold text-zinc-400">
            <button onclick="render('home')" class="hover:text-white">Home</button>
            <button onclick="render('audio')" class="hover:text-white">Music</button>
            <button onclick="render('video')" class="hover:text-white">Video</button>
        </nav>
        <input id="search" type="text" placeholder="Search..." class="bg-[#2a2a2a] rounded-full px-4 py-1 text-sm focus:outline-none">
    </header>

    <main id="content" class="flex-grow p-6 grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6 content-start"></main>

    <footer class="p-4 bg-[#121212]">
        <div id="player"></div>
    </footer>
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    <script src="app.js"></script>
</body>
</html>
